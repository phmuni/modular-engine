# Builds the engine, its tools and a game of each kind on macOS, Linux and Windows. Nothing here draws a frame (the
# runners have no GPU), so it checks that everything compiles and that the launcher creates projects that build.
name: Build

on:
  push:
    branches: [main, ci]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Listed one by one: an include that only adds a key to an existing os extends that entry instead of adding one
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: windows-latest # MSVC
          # Clang on Windows with Microsoft's library (clang-cl): it says it is Clang, but has MSVC's headers
          - os: windows-latest
            toolset: ClangCL
    name: build (${{ matrix.os }}${{ matrix.toolset && format(', {0}', matrix.toolset) || '' }})
    runs-on: ${{ matrix.os }}
    env:
      # Dependency downloads (SDL, RmlUi, Jolt...) shared by the engine and the test game, and kept between runs
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - uses: actions/checkout@v4

      - name: Lua API definitions cover scriptSystem.cpp
        if: runner.os == 'Linux'
        run: python3 tools/check_lua_api.py

      - name: Every C++ game API method is bound in Lua
        if: runner.os == 'Linux'
        run: python3 tools/check_api_parity.py

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Linux packages (what SDL needs for windows, input and sound)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxinerama-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.toolset && format('-T {0}', matrix.toolset) || '' }}

      - name: Build the engine, the examples, the runner and the launcher
        run: cmake --build build --config Release --parallel 4

      - name: Create a project of each kind with the launcher
        shell: bash
        run: |
          launcher=bin/launcher/launcher
          [ -f "$launcher.exe" ] && launcher="$launcher.exe"
          "$launcher" --create "$RUNNER_TEMP/LuaGame" lua
          "$launcher" --create "$RUNNER_TEMP/CppGame" cpp
          "$launcher" --create "$RUNNER_TEMP/MixedGame" mixed
          ls "$RUNNER_TEMP/LuaGame/bin"

      - name: Build the C++ + Lua game against this checkout
        shell: bash
        run: |
          cmake -S "$RUNNER_TEMP/MixedGame" -B "$RUNNER_TEMP/MixedGame/build" -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.toolset && format('-T {0}', matrix.toolset) || '' }}
          cmake --build "$RUNNER_TEMP/MixedGame/build" --config Release --parallel 4
          ls "$RUNNER_TEMP/MixedGame/bin"
