# Builds the engine, its tools and a game of each kind on macOS, Linux and Windows, and checks that the launcher creates
# projects that build. Linux also runs the behavior tests (tests/, tools/run_tests.py) on a virtual screen with Mesa's
# software OpenGL, as the runners have no GPU. macOS runs them too, without failing the build (a runner's OpenGL is not
# something to rely on). Windows has no OpenGL beyond 1.1 on a runner, so its tests run with Mesa's llvmpipe
# (pal1000/mesa-dist-win, a pinned release) copied next to engine_tests.exe, and do not fail the build either.
name: Build

on:
  push:
    branches: [main, ci]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Listed one by one: an include that only adds a key to an existing os extends that entry instead of adding one
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: windows-latest # MSVC
          # Clang on Windows with Microsoft's library (clang-cl): it says it is Clang, but has MSVC's headers
          - os: windows-latest
            toolset: ClangCL
    name: build (${{ matrix.os }}${{ matrix.toolset && format(', {0}', matrix.toolset) || '' }})
    runs-on: ${{ matrix.os }}
    env:
      # Dependency downloads (SDL, RmlUi, Jolt...) shared by the engine and the test game, and kept between runs
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - uses: actions/checkout@v4

      - name: Lua API definitions cover the Lua bindings
        if: runner.os == 'Linux'
        run: python3 tools/check_lua_api.py

      - name: Every C++ game API method is bound in Lua
        if: runner.os == 'Linux'
        run: python3 tools/check_api_parity.py

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Linux packages (what SDL needs for windows, input and sound)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxinerama-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DMODULAR_ENGINE_BUILD_TESTS=ON \
            ${{ matrix.toolset && format('-T {0}', matrix.toolset) || '' }}

      - name: Build the engine, the examples, the runner, the launcher and the tests
        run: cmake --build build --config Release --parallel 4

      # One start of bin/engine_tests per test, each on fixed 1/60 s frames; the runner exits non-zero on any failure and
      # prints the failing test's output. Mesa's llvmpipe gives the OpenGL 4.5 core context that the engine asks 4.1 of.
      - name: Behavior tests (virtual screen, software OpenGL)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" python3 tools/run_tests.py -j 2

      - name: Behavior tests (macOS, not required to pass)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: python3 tools/run_tests.py -j 2

      # A runner has no GPU and Windows' own opengl32.dll is OpenGL 1.1. Mesa's opengl32.dll and libgallium_wgl.dll (its
      # software rasterizer, llvmpipe: OpenGL 4.5 core) in the folder of the program are loaded instead of the system's.
      # The MinGW build is the one that has them: the MSVC builds of this release carry only Vulkan and Direct3D parts.
      - name: Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MESA_VERSION: "26.2.7"
          MESA_SHA256: 19c74aad7b09e682473b8de4c35b47e6498de97b71cae5511a231b8eb02f2b22
        run: |
          archive="mesa3d-${MESA_VERSION}-release-mingw.7z"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/$archive"
          echo "$MESA_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          7z x -y "-o$RUNNER_TEMP/mesa" "$RUNNER_TEMP/$archive" > /dev/null
          cp "$RUNNER_TEMP/mesa/x64/opengl32.dll" "$RUNNER_TEMP/mesa/x64/libgallium_wgl.dll" bin/
          ls -la bin/*.dll

      # Not required to pass until it has been seen passing. If it fails, look first at the output of this one test
      # (does a window open, which OpenGL version does the engine report?), then at which tests fail and why.
      - name: Behavior tests, one first (Windows, not required to pass)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          GALLIUM_DRIVER: llvmpipe
        run: python tools/run_tests.py -v tags

      - name: Behavior tests (Windows, not required to pass)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          GALLIUM_DRIVER: llvmpipe
        run: python tools/run_tests.py -j 2

      - name: Create a project of each kind with the launcher
        shell: bash
        run: |
          launcher=bin/launcher/launcher
          [ -f "$launcher.exe" ] && launcher="$launcher.exe"
          "$launcher" --create "$RUNNER_TEMP/LuaGame" lua
          "$launcher" --create "$RUNNER_TEMP/CppGame" cpp
          "$launcher" --create "$RUNNER_TEMP/MixedGame" mixed
          "$launcher" --create "$RUNNER_TEMP/EmptyLua" lua --empty
          "$launcher" --create "$RUNNER_TEMP/EmptyCpp" cpp --empty
          "$launcher" --create "$RUNNER_TEMP/EmptyMixed" mixed --empty
          ls "$RUNNER_TEMP/LuaGame/bin"
          test -f "$RUNNER_TEMP/EmptyLua/assets/scenes/level.json"
          test -f "$RUNNER_TEMP/EmptyMixed/assets/scripts/game.lua"
          test ! -e "$RUNNER_TEMP/EmptyLua/assets/prefabs/coin.json"

      - name: Build the C++ + Lua game against this checkout
        shell: bash
        run: |
          cmake -S "$RUNNER_TEMP/MixedGame" -B "$RUNNER_TEMP/MixedGame/build" -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.toolset && format('-T {0}', matrix.toolset) || '' }}
          cmake --build "$RUNNER_TEMP/MixedGame/build" --config Release --parallel 4
          ls "$RUNNER_TEMP/MixedGame/bin"
